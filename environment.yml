# Working environment of this fork (the paper's original one is environment.upstream.yml,
# py3.8 / torch 1.12, which no longer builds). Tested: Linux, NVIDIA driver >= 530, CUDA 12.1 wheels.
#
#   conda env create -f environment.yml && conda activate logix-gin
#   python scripts/check_setup.py
name: logix-gin
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torch-geometric==2.6.1
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - networkx==3.4.2
      - matplotlib==3.10.9
      - rdkit==2026.3.6
      - tqdm==4.70.1
      - joblib==1.6.0
      - pyyaml==6.0.3
      - mlflow==3.16.1
      - optuna==5.0.0
      - codecarbon==3.3.1
      - ipykernel==7.3.0

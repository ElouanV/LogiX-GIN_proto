# qat_nmp_3fold with at most 8 prototypes (node_mask_push_qat_p8: the nmp_qat space with
# num_prototypes in {4, 8}, everything else unchanged). With 32, most prototypes end with no
# cared bit (constant similarity 1, explorer/): does the search reach the same performance
# with few? Reference: qat_nmp_3fold/node_mask_push_qat on the same folds.
#   python run_experiment.py configs/experiments/qat_nmp_p8_3fold.yaml run --datasets BaMultiShapes
# Extra workers on the study (distinct sampler seeds, see optimize_optuna.py):
#   python optimize_optuna.py --dataset BaMultiShapes --model node_mask_push_qat_p8 --fold 0 --n_trials 15 --sampler_seed 1
name: qat_nmp_p8_3fold
description: >
  NMP prototype LogiX-GIN with a QAT fine-tune and at most 8 prototypes, tuned as
  qat_nmp_3fold (15 trials on fold 0, objective = rule-model val balanced accuracy), then folds 0-2.
datasets: [BaMultiShapes]
models: [node_mask_push_qat_p8]
folds: [0, 1, 2]

teacher:                                 # same k-fold teachers as sum_ablation
  epochs: 500
  hidden_dim: 64
  num_layers: 3
  batch_size: 128
  lr: 0.001
  l2: 1.0e-5
  dropout: 0.15
  split: kfold

hps:
  root: results_hps
  tune_folds: [0]
  n_trials: 15
  sampler_seed: 0
  report_every: 50

final:
  root: results_final

jobs: 3

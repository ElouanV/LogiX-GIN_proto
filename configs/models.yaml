# Students of LogiX-GIN experiments: training script, the arguments that define the
# model (fixed for every run of it) and the search space it is tuned in
# (configs/search_spaces.yaml). The *_sum / *_nosum pairs share their space, so the
# sum-pooling ablation compares two models tuned the same way.
#
# Every prototype student fixes the head saturation (--head_init center --logit_loss of
# train_proto.py) since 2026-10-19: results_final/ and results_hps/ runs from before were
# trained without (their final.json / trials.csv argv say so). classic / classic_nosum stay
# upstream: with the fix, 5/7 classic validation runs predicted one class (PROTEINS fold 0
# included, 0.70 -> 0.50 test bacc).
classic:
  script: logic                     # train_logic.py (upstream GINTELL, mean | max | sum readout)
  space: common
classic_nosum:
  script: logic
  fixed: {pool_ops: "mean,max"}     # models_proto/gintell.py GINTELLPool
  space: common
node_mask_push:                     # NMP: node prototypes + care mask + push
  script: proto                     # train_proto.py
  fixed: {proto_level: node, proto_mask: true, mask_anneal_frac: 0.8, mask_ckpt_temp: 1.0,
         head_init: center, logit_loss: true}
  space: nmp
node_mask_push_sum:
  script: proto
  fixed: {proto_level: node, proto_mask: true, mask_anneal_frac: 0.8, mask_ckpt_temp: 1.0, pool_ops: "mean,max,sum",
         head_init: center, logit_loss: true}
  space: nmp
graph:                              # dense graph-level prototypes
  script: proto
  fixed: {proto_level: graph, push_every: 0,
         head_init: center, logit_loss: true}
  space: proto
graph_sum:
  script: proto
  fixed: {proto_level: graph, push_every: 0, pool_ops: "mean,max,sum",
         head_init: center, logit_loss: true}
  space: proto
node_mask_push_qat:                 # NMP student, then the QAT fine-tune (qat_proto.run_qat, docs/QAT.md):
  script: proto                     # the run is scored and kept as its rule model (every bit binarised)
  fixed: {proto_level: node, proto_mask: true, mask_anneal_frac: 0.8, mask_ckpt_temp: 1.0,
         head_init: center, logit_loss: true}
  space: nmp_qat
  qat: {rate_to: 1.0, ramp_frac: 0.6667, base_weight: 1.0}   # fixed QAT arguments; qat_* in the space

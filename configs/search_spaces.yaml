# Optuna search spaces (utils/hps.py). float: [low, high] (log: log-uniform);
# categorical: choices. A study refuses to resume once its space changed: give a new
# space a new results root (experiment config, hps.root).
# Floats are written with a dot (1.0e-4): YAML 1.1 reads "1e-4" as a string.
common:                             # every student
  lr:           {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  batch_size:   {type: categorical, choices: [16, 32, 64, 128]}
  l2:           {type: categorical, choices: [0.0, 1.0e-4]}
  conv_reg:     {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  fc_reg:       {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  epochs:       {type: categorical, choices: [500, 1000, 2000]}
  warmup_frac:  {type: categorical, choices: [0.2, 0.33, 0.5]}   # --warmup_epochs = round(frac * epochs)
proto:                              # prototype heads
  extends: common
  num_prototypes: {type: categorical, choices: [8, 16, 32]}
  proto_div_reg:  {type: float, low: 1.0e-3, high: 1.0e-1, log: true}
  proto_ent_reg:  {type: float, low: 1.0e-3, high: 1.0e-1, log: true}
nmp:                                # masked node prototypes with push
  extends: proto
  mask_reg:   {type: float, low: 0.05, high: 1.0, log: true}
  push_every: {type: categorical, choices: [50, 100, 200]}
  vocab_reg:  {type: categorical, choices: [0.0, 0.1]}
